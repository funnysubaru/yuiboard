name: CI

on:
  pull_request:
    # 点 Ready for review（ready_for_review）时也要跑：draft 阶段不跑，见下面 job 的 if
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # draft PR 不跑 CI（owner 2026-10-12）：review 期间的修复不重复消耗，`gh pr ready` 后再跑。
    # draft 期间 required check 显示等待中是正常的，GitHub 本来就不能合并 draft。
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: test-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      # 零依赖，不安装包；GitHub 与仓库数据由测试夹具提供。
      - run: npm test
