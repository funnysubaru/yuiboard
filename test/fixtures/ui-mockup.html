<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devboard 看板 UI 稿</title>
<style>
/* UI 稿：静态 mock，不接后端。颜色全部走变量，亮/暗主题各一套。 */
:root{
  --bg:#f6f7f9; --panel:#fff; --panel2:#f1f3f6; --line:#e3e6eb; --text:#1d2330; --muted:#6b7385; --accent:#3b6ef5;
  --s-todo:#9aa3b2; --s-doing:#e8a33d; --s-review:#8b5cf6; --s-merge:#0ea5b7; --s-done:#22a06b;
  --warn:#d9822b; --danger:#d64545; --today:#e5484d;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --panel:#181c24; --panel2:#1f2430; --line:#2a303c; --text:#e6e9ef; --muted:#8f97a8; --accent:#6b93ff;
    --s-todo:#6b7385; --s-doing:#f0b458; --s-review:#a78bfa; --s-merge:#22c3d6; --s-done:#3fbf85;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#181c24; --panel2:#1f2430; --line:#2a303c; --text:#e6e9ef; --muted:#8f97a8; --accent:#6b93ff;
  --s-todo:#6b7385; --s-doing:#f0b458; --s-review:#a78bfa; --s-merge:#22c3d6; --s-done:#3fbf85; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit}
.mockbar{background:#fff4d6;color:#7a5200;padding:6px 16px;font-size:12px;border-bottom:1px solid #f0d48a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mockbar{background:#3a2e10;color:#f3d48a;border-color:#5a4718}}
:root[data-theme="dark"] .mockbar{background:#3a2e10;color:#f3d48a;border-color:#5a4718}

/* 顶栏 */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font-weight:700;font-size:15px}
.brand small{font-weight:400;color:var(--muted);margin-left:6px}
select,.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px;cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.meta{color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--text);font-weight:500}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}

nav{display:flex;gap:2px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--panel2);font-size:11px;margin-left:4px;text-align:center}
.count.warn{background:var(--warn);color:#fff}

main{padding:16px;max-width:1400px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
h2{font-size:14px;margin:0 0 10px}
h3{font-size:13px;margin:0}
.muted{color:var(--muted)}

/* 数字卡 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:12px 14px;cursor:pointer}
.stat .n{font-size:24px;font-weight:700;line-height:1.2}
.stat .l{color:var(--muted);font-size:12px}
.stat .sub{font-size:11px;color:var(--muted)}
.stat.big .n{font-size:28px}
.pbar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;display:flex;margin-top:6px}
.pbar i{display:block;height:100%}

.two>*{min-width:0}
.two{display:grid;grid-template-columns:1fr 340px;gap:14px}
@media (max-width:980px){.two{grid-template-columns:1fr}}

/* 状态徽标：图标 + 文字 + 颜色 三重编码 */
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.st .ic{font-size:13px}
.st.todo{color:var(--s-todo)} .st.doing{color:var(--s-doing)} .st.review{color:var(--s-review)} .st.merge{color:var(--s-merge)} .st.done{color:var(--s-done)}

/* 任务树 */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:180px;color:var(--text)}
.toolbar label{display:inline-flex;gap:4px;align-items:center;color:var(--muted);cursor:pointer}
.doc{border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.grp{display:flex;align-items:center;gap:10px;padding:8px 14px;user-select:text;-webkit-user-select:text}
.grp:hover{background:var(--panel2)}
.grp .caret{width:12px;flex-shrink:0;color:var(--muted);transition:transform .15s}
.grp button.caret,.row .tcaret{background:none;border:0;padding:4px;min-width:28px;min-height:28px;cursor:pointer}
.grp.closed .caret{transform:rotate(-90deg)}
.grp .gname{font-weight:600}
.grp .gp{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.grp .gp .pbar{width:120px;margin:0}
.grp.lv1{background:var(--panel2);font-size:13px}
.grp.lv2{padding-left:30px}
.rows.hide{display:none}
/* 任务行（N23）：状态图标在行首、状态文字在行尾标签前；徽标仍是一个 .st（DOM 与读屏顺序不变），靠 display:contents 把图标和文字分到两列 */
.row{display:grid;grid-template-columns:16px 52px minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:6px 14px 6px 46px;border-top:1px solid var(--line);user-select:text;-webkit-user-select:text}
.row>*{grid-row:1}
.row .st-cell,.row .st-cell .st{display:contents}
.row .st .ic{grid-column:1;grid-row:1;font-size:13px;text-align:center}
.row .st .tx{grid-column:4;grid-row:1;font-size:11px;white-space:nowrap}
.row .id{grid-column:2} .row .title{grid-column:3} .row .tags{grid-column:5} .row .task-detail{grid-column:6}
.row:hover{background:var(--panel2)}
.row.child{padding-left:70px}
.row.child .id::before{content:"└";margin-right:4px;color:var(--muted);opacity:.6}
.row .id{font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-size:12px;white-space:nowrap}
/* 展开的分组 = 卡片：标题行垫底色，任务挂在卡片里，子任务再缩一级、底色略深；折叠的分组仍是普通一行。
   折叠时也占同样的盒子（透明边框、同样的外边距与内边距），展开只是把卡片显出来，标题与进度条不跳位 */
.gblock{margin:2px 14px 2px 28px;border:1px solid transparent;border-radius:8px;overflow:hidden}
.gblock>.grp.lv2{padding-left:10px}
.gblock.open{margin-bottom:12px;border-color:var(--line);background:var(--panel)}
.gblock.open>.grp.lv2{background:var(--panel2)}
.gblock.open .row{padding-left:36px}
.gblock.open .row.child{padding-left:60px;background:color-mix(in srgb,var(--panel2) 45%,transparent)}
.gblock.open .row:hover{background:var(--panel2)}
.row .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .title .dep{color:var(--muted);font-size:11px;margin-left:8px}
.row .tcaret{display:inline-block;width:14px;color:var(--muted);cursor:pointer}
.row .tcaret:hover{color:var(--text)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:inherit}
.tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pr{font-size:11px;border-radius:10px;padding:1px 8px;border:1px solid;white-space:nowrap;text-decoration:none}
.pr.draft{color:var(--s-review);border-color:var(--s-review)}
.pr.ready{color:var(--s-merge);border-color:var(--s-merge)}
.pr.merged{color:#fff;background:var(--s-done);border-color:var(--s-done)}
.pr.unsynced{color:var(--s-done);border-color:var(--s-done);border-style:dashed}
.pr.closed{color:var(--muted);border-color:var(--line);text-decoration:line-through}
.ai{font-size:11px;border-radius:10px;padding:1px 8px;background:var(--panel2);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.ai .dot{width:7px;height:7px;border-radius:50%;background:var(--s-doing)}
.ai.running .dot{animation:pulse 1.4s infinite}
.ai.stalled{color:var(--warn)} .ai.stalled .dot{background:var(--warn)}
.ai.recent .dot{background:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,163,61,.6)}70%{box-shadow:0 0 0 6px rgba(232,163,61,0)}100%{box-shadow:0 0 0 0 rgba(232,163,61,0)}}
.flag{font-size:11px;color:var(--warn)}
.flag.info{color:var(--muted)}
.blk{font-size:11px;color:var(--danger);border:1px solid var(--danger);border-radius:10px;padding:0 6px}

/* 右栏 */
.side .sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.side .sec:last-child{border-bottom:0}
.ev{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:4px 0;font-size:12px}
.ev .t{color:var(--muted)}
.unl{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:12px}
.unl:first-of-type{border-top:0}
.unl .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 甘特 */
.gantt{display:grid;grid-template-columns:340px 1fr;overflow:hidden}
.glabels{border-right:1px solid var(--line)}
.gscroll{overflow-x:auto;position:relative}
.gtrack{position:relative}
.gh{height:44px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.glabels .gh{display:flex;align-items:flex-end;padding:0 10px 6px;color:var(--muted);font-size:12px}
.gl{height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;cursor:pointer}
.gl.g1{background:var(--panel2);font-weight:600}
.gl.g2{padding-left:24px;font-weight:600}
.gl.t{padding-left:38px}
.gl .id{font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-size:11px;min-width:30px}
.gl .tt{overflow:hidden;text-overflow:ellipsis}
.gr{height:26px;border-bottom:1px solid var(--line);position:relative}
.gr.g1{background:var(--panel2)}
.gr.dim,.gl.dim{opacity:.35}
.gr.hl,.gl.hl{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.day{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);opacity:.5}
.day.wk{opacity:1}
.dlab{position:absolute;bottom:4px;font-size:10px;color:var(--muted);transform:translateX(3px)}
.mlab{position:absolute;top:4px;font-size:11px;font-weight:600;transform:translateX(3px)}
.today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--today);z-index:3;pointer-events:none}
.today span{position:absolute;top:2px;left:3px;white-space:nowrap;background:var(--today);color:#fff;font-size:10px;padding:0 4px;border-radius:3px}
.bar{position:absolute;top:6px;height:14px;border-radius:3px;cursor:pointer}
.bar.est{background:repeating-linear-gradient(45deg,color-mix(in srgb,currentColor 35%,transparent) 0 4px,transparent 4px 8px);border:1px dashed currentColor;background-color:color-mix(in srgb,currentColor 10%,transparent)}
.bar.sum{top:10px;height:6px;border-radius:0;background:var(--muted);opacity:.7}
.bar.sum::before,.bar.sum::after{content:"";position:absolute;top:0;width:3px;height:10px;background:inherit}
.bar.sum::before{left:0} .bar.sum::after{right:0}
.blabel{position:absolute;top:5px;font-size:10px;color:var(--muted);white-space:nowrap;pointer-events:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px}
.sw{display:inline-block;width:18px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
.note{font-size:11px;color:var(--muted);padding:6px 14px;border-bottom:1px solid var(--line)}
svg.links{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}


/* 关系图 */
.gwrap{overflow:auto;max-height:calc(100vh - 260px);background:var(--panel)}
.gnode rect{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.gnode{cursor:pointer}
.gnode .bar{stroke:none}
.gnode text{font-size:11px;fill:var(--text)}
.gnode text.gid{font-family:ui-monospace,Menlo,monospace;fill:var(--muted);font-size:10px}
.gnode.done{opacity:.55}
.gnode.blocked rect.box{stroke:var(--danger);stroke-dasharray:4 3}
.gnode.cyc rect.box{stroke:var(--danger);stroke-width:2}
.gnode.sel rect.box{stroke:var(--accent);stroke-width:2.2}
.gnode.pre rect.box{stroke:var(--accent)}
.gnode.post rect.box{stroke:var(--muted);stroke-width:2}
.gnode.parhl rect.box{stroke:var(--s-done);stroke-width:2}
.gnode.fade,.gedge.fade{opacity:.15}
.gedge{fill:none;stroke:var(--muted);stroke-width:1.2}
.gedge.par{stroke-dasharray:4 4;stroke:var(--s-done)}
.gedge.on{stroke:var(--accent);stroke-width:2}
.laycol{font-size:10px;fill:var(--muted)}

/* 下一步 */
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:1100px){.cols{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
.col{padding:12px}
.col h2{display:flex;align-items:center;gap:6px}
.col .hint{font-size:11px;color:var(--muted);margin:-6px 0 10px}
.batch{border:1px dashed var(--s-done);border-radius:8px;padding:6px;margin-bottom:10px}
.batch .bl{font-size:11px;color:var(--s-done);margin:0 0 4px 2px}
.tk{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.tk:hover{border-color:var(--accent)}
.tk .top{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.tk .tt{margin:2px 0 4px}
.tk .why{font-size:11px;color:var(--muted)}
.tk .why.red{color:var(--danger)}

/* 抽屉 */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .2s;z-index:20;overflow-y:auto}
.drawer.open{transform:none}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;position:sticky;top:0;background:var(--panel)}
.drawer .hd h2{margin:0;flex:1}
.drawer .bd{padding:6px 16px 20px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;margin:10px 0;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.box{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:12px}
.box .src{color:var(--muted);font-size:11px}
code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--panel2);padding:0 4px;border-radius:3px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s;z-index:19}
.scrim.open{opacity:1;pointer-events:auto}
.hidden{display:none}

@media (max-width:620px){
  .row,.gblock.open .row{grid-template-columns:16px auto minmax(0,1fr) auto;padding-left:16px}
  .row.child,.gblock.open .row.child{padding-left:32px}
  .row .st .tx{display:none}
  .row .task-detail{grid-column:4}
  .row .tags{grid-column:1/-1;grid-row:2;justify-content:flex-start}
  .gblock{margin-left:14px}
  .gantt{grid-template-columns:160px 1fr}
}
</style>
</head>
<body>
<div class="mockbar">UI 稿（静态 mock）。collab-m0-space-run 与 devboard-mvp 都是<b>虚构示例</b>，用来演示各种状态。"今天"固定为 2026-09-26。</div>

<header>
  <div class="brand">devboard<small>AI 开发进度看板</small></div>
  <select aria-label="项目"><option>Acme</option><option disabled>（以后：其它项目）</option></select>
  <div class="seg" id="lineSeg" role="group" aria-label="分支线">
    <button class="on" data-line="all">全部</button><button data-line="v2">V2 协作版</button><button data-line="main">main 个人版</button>
  </div>
  <div class="spacer"></div>
  <div class="meta">
    <span>工作区 <b>acme-chat</b> · release/v2 @ <b>3e7a9c1d</b></span>
    <span>文档 3 秒前</span><span>AI 会话 5 秒前</span><span>GitHub 1 分钟前</span>
  </div>
  <button class="btn" title="立即重读文档、会话与 GitHub">↻ 刷新</button>
  <button class="btn" id="themeBtn" title="切换亮/暗">◐</button>
</header>

<nav id="nav">
  <button data-v="overview" class="on">总览</button>
  <button data-v="gantt">甘特图</button>
  <button data-v="graph">关系图</button>
  <button data-v="next">下一步</button>
  <button data-v="check">需要确认<span class="count warn">3</span></button>
  <button data-v="diag">诊断</button>
</nav>

<main>
  <section id="v-overview"></section>
  <section id="v-gantt" class="hidden"></section>
  <section id="v-graph" class="hidden"></section>
  <section id="v-next" class="hidden"></section>
  <section id="v-check" class="hidden"></section>
  <section id="v-diag" class="hidden"></section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="任务详情"></aside>

<script>
/* ============ mock 数据 ============
   status: todo 未开始 / doing 进行中 / review 已发 PR 等待 review / merge review 完成等待合并 / done 已合并完成
   pr.st: draft / ready / merged（已同步到本地）/ unsynced（GitHub 已合并、本地还没 pull）/ closed
   ai: running 运行中（10 分钟内有新记录）/ recent 最近活跃 / stalled 停滞（3 天无记录）
   日期：d('09-24') = 2026-09-24 */
const TODAY = new Date('2026-09-26T10:00:00');
const d = s => new Date('2026-' + s + 'T09:00:00');
const S = {todo:['○','未开始'],doing:['◔','进行中'],review:['◑','等待 review'],merge:['◕','等待合并'],done:['●','已合并完成']};
const PRS = {
  344:{t:'[V2] feat(chat): M0-b 消息库 migration + 函数 + 行级权限 + T1',line:'v2',st:'merged',c:'09-23',m:'09-23'},
  360:{t:'[V2] feat(chat): M0-c 两个插件 + 部署物 + web 客户端 + 场景 A 在 mock 上过',line:'v2',st:'merged',c:'09-24',m:'09-24'},
  365:{t:'[V2] feat(chat): M0-d 场景 B + 韧性用例，修两处缺陷',line:'v2',st:'merged',c:'09-24',m:'09-25'},
  369:{t:'[V2] feat(chat): UI 改进轮——外壳、消息操作、停止回复',line:'v2',st:'merged',c:'09-25',m:'09-25'},
  372:{t:'[V2] docs(chat): 任务 15.2 chat-admin 使用文档 + spike 结论回写',line:'v2',st:'draft',c:'09-25'},
  371:{t:'fix(gateway): 自定义 provider 的 key 补上来源',line:'main',st:'ready',c:'09-25'},
  380:{t:'feat(devboard): 任务 1 项目骨架与配置',line:'v2',st:'merged',c:'09-15',m:'09-16'},
  381:{t:'feat(devboard): 任务 2.1 tasks.md 解析',line:'v2',st:'unsynced',c:'09-17',m:'09-25'},
  383:{t:'feat(devboard): 任务 2.2 ADR 解析',line:'v2',st:'ready',c:'09-19'},
  384:{t:'feat(devboard): 任务 2.3 Mermaid 依赖图',line:'v2',st:'draft',c:'09-22'},

      rows.push({k:'g2',label:g.t,gid,closed:GSTATE[gid]??all,prog:`${G.filter(t=>t.st==='done').length}/${G.length}`,
        s:spans.length?new Date(Math.min(...spans)):null,e:spans.length?new Date(Math.max(...spans)):null,unsch:G.filter(t=>t.unsch||t.block).length});
      if(!(GSTATE[gid]??all)) G.forEach(t=>rows.push({k:'t',t}));
    });
  });

}

/* 悬停：高亮前置/后续，画依赖折线，其余变淡 */
function hl(key){
  const svg=document.getElementById('links');if(!svg)return;svg.innerHTML='';
  document.querySelectorAll('.gl,.gr').forEach(e=>e.classList.remove('dim','hl'));
  if(!key)return;
  const t=BYKEY[key];
  const pre=(t.dep||[]).map(id=>tk(t.doc,id)).filter(Boolean);
  const post=ALL.filter(o=>o.doc===t.doc&&(o.dep||[]).includes(t.id));
  const par=(t.par||[]).map(id=>tk(t.doc,id)).filter(Boolean);
  const keep=new Set([t,...pre,...post,...par].map(o=>o.key));
  document.querySelectorAll('.gl[data-key],.gr[data-key]').forEach(e=>{
    if(!keep.has(e.dataset.key)) e.classList.add('dim'); else if(par.some(p=>p.key===e.dataset.key)) e.classList.add('hl');});
  const rowY=k=>{const e=document.querySelector(`.gr[data-key="${k}"]`);return e?e.offsetTop+13:null;};
  const endX=o=>o.est?x(d(o.est[1]))+PX:o.e?x(d(o.e))+PX:o.s?x(TODAY):null;
  const startX=o=>o.s?x(d(o.s)):o.est?Math.max(x(d(o.est[0])),x(TODAY)):null;
  const line=(a,b,col)=>{const y1=rowY(a.key),y2=rowY(b.key),x1=endX(a),x2=startX(b);if(y1==null||y2==null||x1==null||x2==null)return;
    const mx=Math.max(x1+8,Math.min(x2-8,x1+8));
    svg.insertAdjacentHTML('beforeend',`<path d="M${x1} ${y1} H${mx} V${y2} H${x2}" fill="none" stroke="${col}" stroke-width="1.5"/><path d="M${x2} ${y2} l-5 -3 v6 z" fill="${col}"/>`);};
  pre.forEach(p=>line(p,t,'var(--accent)'));post.forEach(p=>line(t,p,'var(--muted)'));
}


/* ============ 关系图 ============
   按文档画：列 = 依赖层级（没有前置的在第 0 列，其余 = 最长前置链 + 1），列内按文档顺序。
   实线箭头 = 依赖（前置 → 后续）；绿色虚线无箭头 = 文档写明可并行。 */
let GRAPH_DOC='devboard-mvp', GRAPH_FADE_DONE=true, GRAPH_OPEN_ONLY=true;
function renderGraph(){
  /* 「只看未完成」：长文档里已完成的任务占满画面，隐藏后只剩还要做的部分；指向已完成任务的依赖线一并省略 */
  const L=ALL.filter(t=>t.doc===GRAPH_DOC&&!(GRAPH_OPEN_ONLY&&t.st==='done'));
  const by=Object.fromEntries(L.map(t=>[t.id,t]));
  const lay={};const layer=t=>{if(lay[t.id]!=null)return lay[t.id];lay[t.id]=0;
    const ds=(t.dep||[]).map(id=>by[id]).filter(Boolean);lay[t.id]=ds.length?1+Math.max(...ds.map(layer)):0;return lay[t.id];};
  L.forEach(layer);
  const cols=[];L.forEach(t=>{(cols[lay[t.id]]=cols[lay[t.id]]||[]).push(t);});
  /* 列内排序：按前置在上一列的平均位置（重心法）排一遍，明显减少连线交叉；没有前置的保持文档顺序 */
  const rank={};cols.forEach(c=>{c.forEach((t,j)=>{const ds=(t.dep||[]).filter(id=>rank[id]!=null);t._bc=ds.length?ds.reduce((a,id)=>a+rank[id],0)/ds.length:j;});
    c.sort((a,b)=>a._bc-b._bc);c.forEach((t,j)=>rank[t.id]=j);});
  const NW=178,NH=42,CG=64,RG=12,PAD=24,TOP=28;
  const pos={};cols.forEach((c,i)=>c.forEach((t,j)=>pos[t.id]={x:PAD+i*(NW+CG),y:TOP+j*(NH+RG)}));
  const W=PAD*2+cols.length*(NW+CG), H=TOP+Math.max(...cols.map(c=>c.length))*(NH+RG)+PAD;
  let edges='',pars='',seen=new Set();
  L.forEach(t=>{(t.dep||[]).forEach(id=>{const a=pos[id],b=pos[t.id];if(!a)return;
      const x1=a.x+NW,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2,mx=(x1+x2)/2;
      edges+=`<path class="gedge" data-a="${id}" data-b="${t.id}" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2-6} ${y2}" marker-end="url(#arr)"/>`;});
    (t.par||[]).forEach(id=>{const k=[t.id,id].sort().join('|');if(seen.has(k)||!pos[id])return;seen.add(k);
      const a=pos[t.id],b=pos[id];
      const sameCol=a.x===b.x;
      const d=sameCol?`M${a.x+NW} ${a.y+NH/2} C${a.x+NW+26} ${a.y+NH/2} ${b.x+NW+26} ${b.y+NH/2} ${b.x+NW} ${b.y+NH/2}`
                     :`M${a.x+NW/2} ${a.y+NH} L${b.x+NW/2} ${b.y}`;
      pars+=`<path class="gedge par" data-a="${t.id}" data-b="${id}" d="${d}"/>`;});});
  const nodes=L.map(t=>{const p=pos[t.id];const cls=[t.st==='done'&&GRAPH_FADE_DONE?'done':'',(t.block||t.unsch)?'blocked':''].join(' ');
    const title=t.title.length>11?t.title.slice(0,11)+'…':t.title;
    const extra=t.block?'⛔ '+t.block.map(b=>b.split(' ')[0]).join('、'):(t.pr?'#'+t.pr.join(' #'):(t.ai&&AIS[t.id]?(AIS[t.id].st==='running'?'● Claude 运行中':'● Claude 停滞'):''));
    return `<g class="gnode ${cls}" data-id="${t.id}" transform="translate(${p.x},${p.y})" onmouseenter="graphHl('${t.id}')" onmouseleave="graphHl()" onclick="openTask('${t.key}')">
      <title>${esc(t.id+' '+t.title+' · '+S[t.st][1])}</title>
      <rect class="box" width="${NW}" height="${NH}" rx="6"/>
      <rect class="bar" width="4" height="${NH}" rx="2" style="fill:var(--s-${t.st})"/>
      <text x="12" y="16"><tspan class="gid">${esc(t.id)}</tspan>  ${esc(S[t.st][0])} ${esc(title)}</text>
      <text x="12" y="32" style="font-size:10px;fill:${t.block?'var(--danger)':'var(--muted)'}">${esc(extra||S[t.st][1])}</text></g>`;}).join('');
  const heads=cols.map((c,i)=>`<text class="laycol" x="${PAD+i*(NW+CG)}" y="16">${i===0?'第 1 层 · 无前置':'第 '+(i+1)+' 层'}</text>`).join('');
  document.getElementById('v-graph').innerHTML=`
  <div class="card">
    <div class="legend">
      <select id="gdoc">${DOCS.map(d=>`<option value="${d.id}" ${d.id===GRAPH_DOC?'selected':''}>${esc(d.title)}</option>`).join('')}</select>
      <span><svg width="34" height="10"><path d="M2 5 H26" stroke="var(--muted)" stroke-width="1.5"/><path d="M32 5 l-6 -3 v6z" fill="var(--muted)"/></svg> 依赖（先后顺序）</span>
      <span><svg width="30" height="10"><path d="M2 5 H28" stroke="var(--s-done)" stroke-width="1.5" stroke-dasharray="4 4"/></svg> 可并行</span>
      <span><svg width="18" height="12"><rect x="1" y="1" width="16" height="10" rx="2" fill="none" stroke="var(--danger)" stroke-dasharray="3 2"/></svg> 被阻塞 / 无法排期</span>
      <span><svg width="18" height="12"><rect x="1" y="1" width="16" height="10" rx="2" fill="none" stroke="var(--danger)" stroke-width="2"/></svg> 依赖成环</span>
      <span class="spacer" style="flex:1"></span>
      <label class="muted" style="font-size:12px"><input type="checkbox" id="gopen" ${GRAPH_OPEN_ONLY?'checked':''}> 只看未完成</label>
      <label class="muted" style="font-size:12px"><input type="checkbox" id="gfade" ${GRAPH_FADE_DONE?'checked':''}> 淡化已完成</label>
    </div>
    <div class="note">从左往右读：越往右越晚才能做。同一列里的任务互相不依赖，前置满足后可以一起做。鼠标移到任务上高亮它的前置（蓝）、后续（灰）和可并行任务（绿），点任务看详情。</div>
    <div class="gwrap"><svg width="${W}" height="${H}" id="gsvg">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--muted)"/></marker></defs>
      ${heads}${pars}${edges}${nodes}</svg></div>
  </div>`;
  document.getElementById('gdoc').onchange=e=>{GRAPH_DOC=e.target.value;renderGraph();};
  document.getElementById('gfade').onchange=e=>{GRAPH_FADE_DONE=e.target.checked;renderGraph();};
  document.getElementById('gopen').onchange=e=>{GRAPH_OPEN_ONLY=e.target.checked;renderGraph();};
}
function graphHl(id){
  const svg=document.getElementById('gsvg');if(!svg)return;
  svg.querySelectorAll('.gnode,.gedge').forEach(e=>e.classList.remove('fade','sel','pre','post','parhl','on'));
  if(!id)return;
  const t=tk(GRAPH_DOC,id);
  const pre=new Set(t.dep||[]), par=new Set(t.par||[]);
  const post=new Set(ALL.filter(o=>o.doc===GRAPH_DOC&&(o.dep||[]).includes(id)).map(o=>o.id));
  svg.querySelectorAll('.gnode').forEach(n=>{const i=n.dataset.id;
    if(i===id)n.classList.add('sel');else if(pre.has(i))n.classList.add('pre');else if(post.has(i))n.classList.add('post');else if(par.has(i))n.classList.add('parhl');else n.classList.add('fade');});
  svg.querySelectorAll('.gedge').forEach(e=>{(e.dataset.a===id||e.dataset.b===id)?e.classList.add('on'):e.classList.add('fade');});
}

       :'<div class="muted" style="margin:6px 0">没有关联的 AI 会话。</div>'}
      <h3 style="margin-top:14px">甘特时间</h3>
      <div class="box">${t.s?`事实开始 ${t.s}（${a?'AI 会话':'PR 创建'}）`:'未开始'}${t.e?` · 结束 ${t.e}（PR 合并）`:''}${t.est?`<br>预估 ${t.est[0]} → ${t.est[1]}（${t.s?'文档预计耗时':'默认 1 天'}，排在前置之后）`:''}${t.unsch?`<br><span style="color:var(--danger)">无法排期：${esc(t.unsch)}</span>`:''}${t.notime?'无时间：仅文档确认，没有 PR 和会话':''}</div>
    </div>`;
  document.getElementById('drawer').classList.add('open');document.getElementById('scrim').classList.add('open');
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('open');}
document.getElementById('scrim').onclick=closeDrawer;
addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

/* ============ 路由 ============ */
function go(v){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hidden',s.id!=='v-'+v));
  if(v==='gantt') renderGantt(); if(v==='next') renderNext(); if(v==='graph') renderGraph();
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
document.querySelectorAll('#lineSeg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#lineSeg button').forEach(x=>x.classList.toggle('on',x===b));});
document.getElementById('themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';};
renderOverview();renderCheck();
</script>
</body>
</html>
